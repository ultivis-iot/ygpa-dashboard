# 센서 최신값을 모아 정적 사이트를 GitHub Pages 에 게시한다. 10분마다 tick.yml 이 이 워크플로를 실행한다(예약 실행은 믿을 수 없어 쓰지 않는다).
# 호출이 하나라도 실패하면(collect.mjs 종료 코드 1) 게시하지 않아 이전 값이 그대로 남는다.
# 직접 만든 워크플로로 게시하므로 Pages 의 "시간당 빌드 10회" 소프트 제한은 적용되지 않는다.
name: Publish site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# 게시 작업은 한 번에 하나만. 돌고 있는 게시를 끊지 않고 다음 것이 기다린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 인증 값을 넣기 전에는 예약 실행이 실패 알림을 쌓지 않게, 저장소 변수 COLLECT_ENABLED 가 'true' 일 때만 돈다.
    if: vars.COLLECT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 액션은 태그가 아니라 커밋 해시로 고정한다(공개 저장소에서 Secrets 를 쓰므로).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # 빌드가 site/ 를 지우므로 반드시 수집보다 먼저 한다.
      - name: 정적 사이트 만들기
        run: node scripts/build-site.mjs
      - name: 센서 값 모으기
        env:
          API_HOST: ${{ vars.API_HOST }}
          API_AUTH: ${{ secrets.API_AUTH }}
        run: node scripts/collect.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
